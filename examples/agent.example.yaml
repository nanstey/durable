version: 1
id: api
description: Keep acme/api moving toward human review
profile: work
models:
  steward: { model: openai-codex/<model>, thinking: low }
  worker: { model: openai-codex/<model>, thinking: medium }
  reviewer: { model: anthropic/<model>, thinking: medium }
scope:
  repos:
    - slug: acme/api
      policySource: { kind: none }
workers:
  dispatcher: git-process
  kind: pi-session
  durable: { enabledRoles: [], maxConcurrent: 2, skills: [], viewer: on-demand }
merge: { mode: human-approval }
